name: Terraform

on:
  pull_request:
    paths:
      - "clouds/**"
      - "docker/ci/**"
      - ".mise.toml"
      - ".pre-commit-config.yaml"
      - "**/.terraform.lock.hcl"
      - "renovate.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/toolchain-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  terragrunt:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ajcandfield/tf-repos/ci@sha256:f3b1f387214b24b30c2b164bbeef6f031257ad3712bf653bc9a18aa056e94d38
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check Terragrunt HCL formatting
        run: terragrunt hcl fmt --check
      - name: Validate every Terragrunt unit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: terragrunt run --all --non-interactive -- validate
