redactions = ["*_TOKEN"]

[tools]
terraform = "1.15.8"
terragrunt = "1.1.2"
pre-commit = "4.6.2"
sops = "3.13.3"
age = "1.3.1"

[env]
GITHUB_TOKEN = "{{ exec(command='gh auth token', cache_key='github-token', cache_duration='4h') | trim }}"
SOPS_AGE_KEY_FILE = "{{ env.HOME }}/.config/sops/age/keys.txt"

[settings]
# Automatically load envars from files in the project with this name
env_file = ".env"
